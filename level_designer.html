<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanMaster - Level Designer</title>
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --primary: #38bdf8; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border: #334155; --danger: #ef4444; --success: #10b981;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-main); color: var(--text-main); padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        h2, h3 { color: var(--primary); margin-top: 0; }
        
        .settings { display: flex; gap: 20px; margin-bottom: 20px; }
        .settings label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 14px; }
        .settings input, .settings select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-main); color: #fff; }
        
        .notes-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .note-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--border); background: var(--bg-main); color: var(--text-main); font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .note-btn:hover { border-color: var(--primary); }
        .note-btn.active { background: var(--primary); color: var(--bg-main); border-color: var(--primary); transform: scale(1.1); }
        
        .current-step { background: var(--bg-main); border: 1px dashed var(--border); padding: 15px; border-radius: 8px; min-height: 50px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; align-items: center; }
        .chip { background: var(--primary); color: var(--bg-main); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .chip:hover { background: var(--danger); color: white; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-add { background: var(--success); color: #fff; }
        .btn-clear { background: var(--border); color: #fff; }
        .btn-gen { background: var(--primary); color: var(--bg-main); width: 100%; margin-top: 10px; font-size: 18px; padding: 15px; }
        
        .steps-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .step-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); }
        .step-notes { display: flex; gap: 5px; }
        .step-note { padding: 2px 8px; border-radius: 10px; color: #000; font-weight: bold; font-size: 12px; }
        .step-del { background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; }
        
        textarea { width: 100%; height: 250px; background: #000; color: #10b981; font-family: monospace; padding: 10px; border-radius: 8px; border: 1px solid var(--border); direction: ltr; text-align: left; box-sizing: border-box; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎼 ابزار طراحی مراحل آموزشی PanMaster</h2>
    
    <div class="card">
        <div class="settings">
            <div>
                <label>شماره مرحله (Level)</label>
                <input type="number" id="level-num" value="1" min="1" max="5">
            </div>
            <div>
                <label>سرعت سقوط (Fall Speed)</label>
                <input type="number" id="fall-speed" value="0.8" step="0.1" min="0.1" max="2.0">
            </div>
            <div>
                <label>عنوان مرحله</label>
                <input type="text" id="level-title" value="مرحله جدید">
            </div>
        </div>

        <h3>۱. نت‌های این گام را انتخاب کن:</h3>
        <div class="notes-grid" id="notes-grid"></div>

        <h3>۲. گام فعلی (چند نت می‌توانی انتخاب کنی):</h3>
        <div class="current-step" id="current-step-list">
            <span style="color:var(--text-muted); font-size:14px;">هنوز نتی انتخاب نشده...</span>
        </div>

        <div class="controls">
            <button class="btn btn-add" onclick="commitStep()">✅ ثبت این گام</button>
            <button class="btn btn-clear" onclick="newStep()">➕ گام جدید</button>
        </div>
    </div>

    <div class="card">
        <h3>📋 لیست گام‌های ثبت شده (به ترتیب):</h3>
        <div class="steps-list" id="steps-list">
            <span style="color:var(--text-muted); font-size:14px; text-align:center;">لیست خالی است</span>
        </div>
    </div>

    <div class="card">
        <button class="btn btn-gen" onclick="generateCode()">🚀 تولید کد آماده برای کپی</button>
        <textarea id="output" readonly placeholder="کد در اینجا تولید می‌شود..."></textarea>
        <p style="color:var(--text-muted); font-size:12px; margin-top:10px;">کد تولید شده را کپی کرده و طبق راهنمای دیپ در فایل <code>game-engine.js</code> جایگزین کن.</p>
    </div>
</div>

<script>
    const NOTE_KEYS = ["D", "1", "2", "3", "4", "5", "6", "7", "8"];
    const NOTE_COLORS = {
        "1": "#f472b6", "2": "#34d399", "3": "#38bdf8", "4": "#2dd4bf", 
        "5": "#818cf8", "6": "#fbbf24", "7": "#a78bfa", "8": "#fb7185", "D": "#60a5fa"
    };

    let currentStepNotes = [];
    let steps = [];

    // ساخت دکمه‌های نت
    const grid = document.getElementById('notes-grid');
    NOTE_KEYS.forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'note-btn';
        btn.innerText = k;
        btn.style.color = NOTE_COLORS[k];
        btn.style.borderColor = NOTE_COLORS[k];
        btn.onclick = () => toggleNote(k);
        btn.id = 'btn-note-' + k;
        grid.appendChild(btn);
    });

    function toggleNote(k) {
        const idx = currentStepNotes.indexOf(k);
        if (idx !== -1) currentStepNotes.splice(idx, 1);
        else currentStepNotes.push(k);
        renderCurrentStep();
    }

    function renderCurrentStep() {
        const list = document.getElementById('current-step-list');
        list.innerHTML = '';

        if (currentStepNotes.length === 0) {
            list.innerHTML = '<span style="color:var(--text-muted); font-size:14px;">هنوز نتی انتخاب نشده...</span>';
        } else {
            currentStepNotes.forEach(k => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = k;
                chip.style.background = NOTE_COLORS[k];
                chip.onclick = () => toggleNote(k);
                list.appendChild(chip);
            });
        }

        // آپدیت دکمه‌ها
        NOTE_KEYS.forEach(n => {
            const btn = document.getElementById('btn-note-' + n);
            if (currentStepNotes.includes(n)) {
                btn.style.background = NOTE_COLORS[n];
                btn.style.color = '#000';
            } else {
                btn.style.background = 'var(--bg-main)';
                btn.style.color = NOTE_COLORS[n];
            }
        });
    }

    function commitStep() {
        if (currentStepNotes.length === 0) return alert('حداقل یک نت انتخاب کن!');
        steps.push([...currentStepNotes]);
        currentStepNotes = [];
        renderCurrentStep();
        renderStepsList();
    }

    function newStep() {
        currentStepNotes = [];
        renderCurrentStep();
    }

    function renderStepsList() {
        const list = document.getElementById('steps-list');
        list.innerHTML = '';

        if (steps.length === 0) {
            list.innerHTML = '<span style="color:var(--text-muted); font-size:14px; text-align:center;">لیست خالی است</span>';
            return;
        }

        steps.forEach((step, i) => {
            const row = document.createElement('div');
            row.className = 'step-row';

            let notesHtml = '';
            step.forEach(n => {
                notesHtml += `<span class="step-note" style="background:${NOTE_COLORS[n]}">${n}</span>`;
            });

            row.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="color:var(--text-muted); font-size:12px;">#${i+1}</span>
                    <div class="step-notes">${notesHtml}</div>
                </div>
                <button class="step-del" onclick="deleteStep(${i})">✕</button>
            `;
            list.appendChild(row);
        });
    }

    function deleteStep(idx) {
        steps.splice(idx, 1);
        renderStepsList();
    }

    function generateCode() {
        const lvl = document.getElementById('level-num').value;
        const speed = document.getElementById('fall-speed').value;
        const title = document.getElementById('level-title').value;

        if (steps.length === 0) return alert('هنوز هیچ گامی ثبت نکرده‌ای!');

        let dataStr = steps.map(s => `{notes:[${s.map(n => `"${n}"`).join(',')}]}`).join(', ');

        const code = `// جایگزین برای مرحله ${lvl}
${lvl}: { 
    title: "${title}", 
    isTutorial: true, 
    fall_speed: ${speed}, 
    notes_data: [${dataStr}] 
},

// کد اضافه شده به دیکشنری I18N (بخش فارسی):
"tutorial.level_${lvl}": "📖 ${title}",`;

        document.getElementById('output').value = code;
    }
    
    // اجرای اولیه
    renderCurrentStep();
</script>

</body>
</html>
