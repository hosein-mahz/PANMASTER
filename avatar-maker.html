<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 ابزار ساخت آواتار PanMaster</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; border-radius: 20px; padding: 20px; display: flex; gap: 20px; border: 1px solid #334155; max-width: 950px; width: 100%; flex-wrap: wrap; }
        
        .canvas-area { flex: 1; min-width: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .preview-box {
            width: 400px; height: 400px; background: #0f172a; border: 2px dashed #475569;
            border-radius: 10px; position: relative; overflow: hidden; cursor: grab;
            display: flex; justify-content: center; align-items: center;
            /* پس‌زمینه شطرنجی برای دیدن شفافیت */
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), linear-gradient(-45deg, #1e293b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1e293b 75%), linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .preview-box:active { cursor: grabbing; }
        #sourceImage { position: absolute; transform-origin: center center; user-select: none; -webkit-user-drag: none; }
        
        .shape-square { clip-path: inset(0 0 0 0); }
        .shape-circle { clip-path: circle(50% at 50% 50%); }
        .shape-rectangle { clip-path: inset(12.5% 0 12.5% 0); }

        .controls { width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .controls h2 { color: #38bdf8; font-size: 18px; margin: 0 0 10px 0; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; background: #334155; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn:hover { background: #475569; }
        .btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .btn-primary { background: linear-gradient(135deg, #10b981, #059669); color: white; font-weight: bold; margin-top: 10px; padding: 15px; }
        .btn-primary:hover { background: linear-gradient(135deg, #059669, #047857); }
        
        .control-group { display: flex; flex-direction: column; gap: 8px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; }
        .control-group label { font-size: 13px; color: #94a3b8; display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; accent-color: #38bdf8; }
        input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 8px; cursor: pointer; background: transparent; }
        input[type="file"] { display: none; }
        
        .note { font-size: 12px; color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 10px; border-radius: 8px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container">
        <div class="canvas-area">
            <div class="preview-box shape-circle" id="previewBox">
                <img id="sourceImage" style="display: none;">
                <div id="placeholderText" style="color:#475569; text-align:center;">عکس خود را آپلود کنید<br><span style="font-size:24px;">🖼️</span></div>
            </div>
            <p style="color:#94a3b8; font-size:12px; margin-top:10px;">با موس عکس را بکشید (Pan) و با اسلایدر بزرگنمایی کنید.</p>
        </div>

        <div class="controls">
            <h2>⚙️ تنظیمات آواتار</h2>
            
            <label for="fileInput" class="btn" style="text-align:center; background:#38bdf8; color:#0f172a; font-weight:bold; cursor:pointer;">
                📁 آپلود عکس
            </label>
            <input type="file" id="fileInput" accept="image/*">

            <div class="control-group">
                <label>🎯 حذف پس‌زمینه (رنگ را انتخاب کنید)</label>
                <input type="color" id="bgColorPicker" value="#ffffff">
                <label>میزان تحمل رنگ (Tolerance) <span id="tolVal">30</span></label>
                <input type="range" id="toleranceSlider" min="0" max="100" value="30" oninput="document.getElementById('tolVal').innerText=this.value">
                <button class="btn" onclick="removeBackground()" style="background:#ef4444; margin-top:5px;">✂️ حذف رنگ انتخاب شده</button>
            </div>

            <div class="control-group">
                <label>شکل قالب (Mask)</label>
                <div class="btn-group">
                    <button class="btn active" onclick="setShape('circle', this)">دایره</button>
                    <button class="btn" onclick="setShape('square', this)">مربع</button>
                    <button class="btn" onclick="setShape('rectangle', this)">مستطیل</button>
                </div>
            </div>

            <div class="control-group">
                <label>بزرگنمایی (Zoom)</label>
                <input type="range" id="zoomSlider" min="0.1" max="3" step="0.01" value="1" oninput="applyTransform()">
            </div>

            <button class="btn btn-primary" onclick="exportImage()" id="downloadBtn" disabled>
                💾 دانلود خروجی PNG (با پس‌زمینه شفاف)
            </button>

            <div class="note">
                <strong>نکته:</strong> برای اسکین‌های هنگ‌درام از خروجی PNG استفاده کنید. (SVG برای عکس‌های واقعی مناسب نیست).
            </div>
        </div>
    </div>

    <script>
        const img = document.getElementById('sourceImage');
        const previewBox = document.getElementById('previewBox');
        const zoomSlider = document.getElementById('zoomSlider');
        const placeholderText = document.getElementById('placeholderText');
        const downloadBtn = document.getElementById('downloadBtn');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const toleranceSlider = document.getElementById('toleranceSlider');

        let currentImage = null;
        let base64Image = "";
        let currentShape = 'circle';
        let isDragging = false;
        let startX, startY;
        let translateX = 0, translateY = 0;
        let scale = 1;
        let naturalWidth = 0, naturalHeight = 0;

        // 1. آپلود عکس
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                base64Image = event.target.result;
                img.src = base64Image;
                img.style.display = 'block';
                placeholderText.style.display = 'none';
                downloadBtn.disabled = false;
                
                img.onload = function() {
                    naturalWidth = img.naturalWidth;
                    naturalHeight = img.naturalHeight;
                    translateX = 0; translateY = 0; scale = 1;
                    
                    const scaleToFit = Math.min(400 / naturalWidth, 400 / naturalHeight);
                    scale = scaleToFit;
                    zoomSlider.value = scale;
                    applyTransform();
                };
            };
            reader.readAsDataURL(file);
        });

        // 2. حذف پس‌زمینه (Chroma Key)
        function removeBackground() {
            if (!base64Image) return;
            
            const targetColor = bgColorPicker.value;
            const tolerance = parseInt(toleranceSlider.value);
            
            // تبدیل رنگ هگز به RGB
            const r = parseInt(targetColor.substr(1, 2), 16);
            const g = parseInt(targetColor.substr(3, 2), 16);
            const b = parseInt(targetColor.substr(5, 2), 16);

            const canvas = document.createElement('canvas');
            canvas.width = naturalWidth;
            canvas.height = naturalHeight;
            const ctx = canvas.getContext('2d');
            
            const tempImg = new Image();
            tempImg.onload = function() {
                ctx.drawImage(tempImg, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;

                for (let i = 0; i < data.length; i += 4) {
                    const pr = data[i];
                    const pg = data[i + 1];
                    const pb = data[i + 2];
                    
                    // محاسبه فاصله رنگی
                    const diff = Math.sqrt(Math.pow(pr - r, 2) + Math.pow(pg - g, 2) + Math.pow(pb - b, 2));
                    
                    if (diff <= tolerance) {
                        data[i + 3] = 0; // شفاف کردن
                    }
                }
                
                ctx.putImageData(imageData, 0, 0);
                base64Image = canvas.toDataURL('image/png');
                img.src = base64Image;
                applyTransform();
            };
            tempImg.src = base64Image;
        }

        // 3. تغییر شکل
        function setShape(shape, btnElement) {
            currentShape = shape;
            document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            previewBox.className = 'preview-box';
            previewBox.classList.add('shape-' + shape);
        }

        // 4. درگ و زوم
        previewBox.addEventListener('mousedown', (e) => {
            if (!img.src || img.style.display === 'none') return;
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            applyTransform();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        previewBox.addEventListener('touchstart', (e) => {
            if (!img.src) return;
            isDragging = true;
            startX = e.touches[0].clientX - translateX;
            startY = e.touches[0].clientY - translateY;
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            translateX = e.touches[0].clientX - startX;
            translateY = e.touches[0].clientY - startY;
            applyTransform();
        }, { passive: false });
        window.addEventListener('touchend', () => { isDragging = false; });

        function applyTransform() {
            scale = parseFloat(zoomSlider.value);
            img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // 5. خروجی نهایی PNG
        function exportImage() {
            if (!base64Image) return;

            const canvas = document.createElement('canvas');
            const size = 400;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // اعمال ماسک
            ctx.beginPath();
            if (currentShape === 'circle') {
                ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
            } else if (currentShape === 'square') {
                ctx.rect(0, 0, size, size);
            } else if (currentShape === 'rectangle') {
                ctx.rect(0, 50, size, 300);
            }
            ctx.clip();

            // رسم عکس
            const tempImg = new Image();
            tempImg.onload = function() {
                const w = naturalWidth * scale;
                const h = naturalHeight * scale;
                const x = (size - w) / 2 + translateX;
                const y = (size - h) / 2 + translateY;
                
                ctx.drawImage(tempImg, x, y, w, h);

                const dataUrl = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `avatar_${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
            tempImg.src = base64Image;
        }
    </script>
</body>
</html>
