<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ابزار طراحی سکه PanMaster</title>
    <style>
        body { background: #0f172a; color: white; font-family: Tahoma, sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .sidebar { width: 350px; background: #1e293b; padding: 20px; border-left: 1px solid #334155; overflow-y: auto; }
        .preview-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #0b1120; position: relative;}
        
        .control-group { margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; }
        .control-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input[type="color"] { width: 100%; height: 40px; border: none; border-radius: 5px; cursor: pointer; background: none; }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .btn { width: 100%; padding: 12px; background: #38bdf8; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #0ea5e9; }
        .btn-green { background: #10b981; color: white; }
        .btn-green:hover { background: #059669; }
        
        #svg-container { width: 400px; height: 400px; filter: drop-shadow(0 0 30px rgba(250, 204, 21, 0.2)); transition: 0.3s; }
    </style>
</head>
<body>

    <!-- پنل کنترل -->
    <div class="sidebar">
        <h2 style="color:#38bdf8; margin-top:0;">🎨 ابزار طراحی سکه</h2>
        <p style="font-size:13px; color:#94a3b8;">تغییرات را بده و خروجی را بگیر.</p>

        <div class="control-group">
            <label>رنگ بیرونی سکه (طلایی):</label>
            <input type="color" id="colorOuter" value="#facc15">
        </div>

        <div class="control-group">
            <label>رنگ کلاویه (حفره وسط):</label>
            <input type="color" id="colorDimple" value="#92400e">
        </div>

        <div class="control-group">
            <label>سایز کلاویه:</label>
            <input type="range" id="sizeDimple" min="15" max="35" value="25">
        </div>

        <div class="control-group">
            <label>سایز سکه در صفحه:</label>
            <input type="range" id="sizeCoin" min="100" max="500" value="400">
        </div>

        <button class="btn btn-green" onclick="copySVG()">📋 کپی کد SVG</button>
        <p id="copyStatus" style="color:#10b981; text-align:center; margin-top:10px; font-size:13px; display:none;">کپی شد!</p>
    </div>

    <!-- پیش‌نمایش -->
    <div class="preview-area">
        <div id="svg-container">
            <svg id="myCoin" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
                <defs>
                    <radialGradient id="goldGradient" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" id="stopLight" stop-color="#fef08a"/>
                        <stop offset="50%" id="stopMid" stop-color="#facc15"/>
                        <stop offset="100%" id="stopDark" stop-color="#ca8a04"/>
                    </radialGradient>
                    <linearGradient id="dimpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" id="stopDimpleTop" stop-color="#d97706"/>
                        <stop offset="100%" id="stopDimpleBottom" stop-color="#451a03"/>
                    </linearGradient>
                </defs>
                
                <!-- بدنه سکه -->
                <circle cx="50" cy="50" r="48" fill="url(#goldGradient)" stroke="#713f12" stroke-width="2"/>
                <circle cx="50" cy="50" r="40" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.4"/>
                
                <!-- کلاویه -->
                <ellipse id="dimpleOuter" cx="50" cy="50" rx="25" ry="18" fill="url(#dimpleGradient)" stroke="#78350f" stroke-width="2"/>
                <ellipse id="dimpleInner" cx="50" cy="48" rx="20" ry="13" fill="#451a03" opacity="0.8"/>
                
                <!-- افکت نور -->
                <path d="M 25 25 A 35 35 0 0 1 45 15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
            </svg>
        </div>
    </div>

    <script>
        const colorOuter = document.getElementById('colorOuter');
        const colorDimple = document.getElementById('colorDimple');
        const sizeDimple = document.getElementById('sizeDimple');
        const sizeCoin = document.getElementById('sizeCoin');
        
        const stopLight = document.getElementById('stopLight');
        const stopMid = document.getElementById('stopMid');
        const stopDark = document.getElementById('stopDark');
        const stopDimpleTop = document.getElementById('stopDimpleTop');
        const stopDimpleBottom = document.getElementById('stopDimpleBottom');
        
        const dimpleOuter = document.getElementById('dimpleOuter');
        const dimpleInner = document.getElementById('dimpleInner');
        const svgContainer = document.getElementById('svg-container');

        // تغییر رنگ سکه
        colorOuter.addEventListener('input', (e) => {
            const hex = e.target.value;
            stopMid.setAttribute('stop-color', hex);
            // ساخت رنگ روشن‌تر و تیره‌تر بر اساس رنگ انتخابی
            stopLight.setAttribute('stop-color', lightenColor(hex, 40));
            stopDark.setAttribute('stop-color', darkenColor(hex, 40));
        });

        // تغییر رنگ کلاویه
        colorDimple.addEventListener('input', (e) => {
            const hex = e.target.value;
            stopDimpleTop.setAttribute('stop-color', hex);
            stopDimpleBottom.setAttribute('stop-color', darkenColor(hex, 60));
        });

        // تغییر سایز کلاویه
        sizeDimple.addEventListener('input', (e) => {
            const val = e.target.value;
            dimpleOuter.setAttribute('rx', val);
            dimpleOuter.setAttribute('ry', val * 0.7);
            dimpleInner.setAttribute('rx', val * 0.8);
            dimpleInner.setAttribute('ry', val * 0.5);
        });

        // تغییر سایز کل سکه در صفحه
        sizeCoin.addEventListener('input', (e) => {
            svgContainer.style.width = e.target.value + 'px';
            svgContainer.style.height = e.target.value + 'px';
        });

        // توابع کمکی برای روشن/تیره کردن رنگ
        function lightenColor(color, percent) {
            let num = parseInt(color.replace("#",""),16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            B = (num >> 8 & 0x00FF) + amt,
            G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }
        function darkenColor(color, percent) {
            let num = parseInt(color.replace("#",""),16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) - amt,
            B = (num >> 8 & 0x00FF) - amt,
            G = (num & 0x0000FF) - amt;
            return "#" + (0x1000000 + (R>0?R<1?0:R:0)*0x10000 + (B>0?B<1?0:B:0)*0x100 + (G>0?G<1?0:G:0)).toString(16).slice(1);
        }

        // کپی کردن کد نهایی
        function copySVG() {
            const svgCode = document.getElementById('myCoin').outerHTML;
            navigator.clipboard.writeText(svgCode).then(() => {
                const status = document.getElementById('copyStatus');
                status.style.display = 'block';
                setTimeout(() => status.style.display = 'none', 2000);
            });
        }
    </script>
</body>
</html>
